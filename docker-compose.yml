services:
  web:
    build: .
    image: stockmonitor-tso:latest
    container_name: stockmonitor-web
    ports:
      - "80:8080"
      - "443:8081"
    volumes:
      - stockmonitor_data:/app/data
    env_file:
      - .env
    environment:
      - ConnectionStrings__DefaultConnection=DataSource=/app/data/stockmonitor.db;Cache=Shared
    restart: unless-stopped

volumes:
  stockmonitor_data: